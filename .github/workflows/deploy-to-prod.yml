name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag tested on staging (e.g. sha-3f9a1c...)"
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/niklas-bodega-user-service

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid tag: must look like sha-<40 hex characters>"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote image to production
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:production" \
            "$IMAGE:$IMAGE_TAG"

      - name: Redeploy on Railway
        run: npx -y @railway/cli@latest redeploy --service niklas-bodega-user-service --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}
