name: CI

on:
  push:
    branches:
      - pre-prod
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # 3. Run tests
      - name: Run tests
        run: mvn -B test